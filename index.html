<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Radio Static</title>
<style>
  :root { --bg: #000; --fg: #d8d8d8; --dim: #6a6a6a; --line: #2a2a2a; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 16px/1.4 -apple-system, system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
  main { min-height: 100%; display: flex; flex-direction: column; justify-content: center;
    align-items: center; gap: 18px; padding: 24px 16px; box-sizing: border-box; text-align: center; }
  button { font: inherit; color: var(--fg); background: none; border: 1px solid var(--line);
    border-radius: 10px; padding: 14px 28px; min-width: 180px; }
  button:active { background: #111; }
  #status { color: var(--dim); font-size: 14px; min-height: 1.4em; max-width: 320px; font-variant-numeric: tabular-nums; }
  #test { border: none; color: var(--dim); font-size: 14px; padding: 8px; min-width: 0; }
  body.hidden main > * { visibility: hidden; }
</style>
</head>
<body>
<main>
  <button id="go">Start</button>
  <div id="status">Turn the volume up, then press Start.</div>
  <button id="test">Play one now</button>
</main>
<audio id="track" src="track.mp3" loop preload="auto" playsinline></audio>
<audio id="one" src="test.mp3" preload="auto" playsinline></audio>
<script>
// track.mp3 is two hours of silence with the static bursts already in it (see build.py).
// Playing it like music keeps going on iPhone, where a timer can't start sound.
const track = document.getElementById('track');
const one = document.getElementById('one');
const go = document.getElementById('go');
const test = document.getElementById('test');
const status = document.getElementById('status');
let schedule = null, tick = null, wakeLock = null;

fetch('schedule.json').then(r => r.json()).then(s => schedule = s);

if ('mediaSession' in navigator) navigator.mediaSession.metadata = new MediaMetadata({ title: 'Radio' });

function showNext() {
  if (!schedule) return;
  const now = track.currentTime;
  const next = schedule.bursts.find(t => t > now) ?? schedule.duration + schedule.bursts[0];
  const s = Math.max(0, Math.round(next - now));
  status.textContent = `Running. Next one in about ${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}.`;
}

async function keepAwake() {
  try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
}

go.addEventListener('click', async () => {
  if (!track.paused) {
    track.pause();
    clearInterval(tick);
    if (wakeLock) { wakeLock.release(); wakeLock = null; }
    go.textContent = 'Start';
    status.textContent = 'Stopped.';
    return;
  }
  const first = track.currentTime === 0;
  try {
    await track.play();
  } catch (e) {
    status.textContent = 'Could not start the sound. Press Start again.';
    return;
  }
  // Start at a random point so it's different every time (iPhone ignores seeks before playback starts)
  if (first) track.currentTime = Math.random() * 7000;
  go.textContent = 'Stop';
  keepAwake();
  showNext();
  tick = setInterval(showNext, 1000);
});

test.addEventListener('click', () => {
  one.currentTime = 0;
  one.play();
});

// Lock-screen pause or a phone call stops the track; show it so it can be restarted
track.addEventListener('pause', () => {
  if (go.textContent === 'Stop') {
    clearInterval(tick);
    go.textContent = 'Start';
    status.textContent = 'Paused. Press Start to carry on.';
  }
});

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && !track.paused) keepAwake();
});

// Tap the black area to hide the text while it runs
document.querySelector('main').addEventListener('click', e => {
  if (e.target === e.currentTarget && !track.paused) document.body.classList.toggle('hidden');
});
</script>
</body>
</html>
